<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階色彩空間與普朗克軌跡轉換工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #333;
        }
        .preview-box {
            width: 100%;
            height: 80px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            transition: background-color 0.1s;
        }
        .section {
            border: 1px solid #e5e5e7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #0071e3;
            display: flex;
            justify-content: space-between;
        }
        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-group:last-child {
            margin-bottom: 0;
        }
        label {
            width: 45px;
            font-weight: 500;
        }
        input[type="number"] {
            width: 80px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
            font-family: monospace;
        }
        input[type="range"] {
            flex: 1;
        }
        .info-text {
            font-size: 0.9rem;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>色彩空間與普朗克軌跡轉換工具</h2>
    
    <div class="preview-box" id="preview"></div>

    <!-- RGB 區塊 -->
    <div class="section">
        <div class="section-title">RGB (sRGB 螢幕標準)</div>
        <div class="input-group">
            <label>R</label>
            <input type="number" id="in-R" min="0" max="255" value="255">
            <input type="range" id="sl-R" min="0" max="255" value="255">
        </div>
        <div class="input-group">
            <label>G</label>
            <input type="number" id="in-G" min="0" max="255" value="255">
            <input type="range" id="sl-G" min="0" max="255" value="255">
        </div>
        <div class="input-group">
            <label>B</label>
            <input type="number" id="in-B" min="0" max="255" value="255">
            <input type="range" id="sl-B" min="0" max="255" value="255">
        </div>
    </div>

    <!-- HSV 區塊 -->
    <div class="section">
        <div class="section-title">HSV (直覺色彩)</div>
        <div class="input-group">
            <label>H °</label>
            <input type="number" id="in-H" min="0" max="360" value="0">
            <input type="range" id="sl-H" min="0" max="360" value="0">
        </div>
        <div class="input-group">
            <label>S %</label>
            <input type="number" id="in-S" min="0" max="100" value="0">
            <input type="range" id="sl-S" min="0" max="100" value="0">
        </div>
        <div class="input-group">
            <label>V %</label>
            <input type="number" id="in-V" min="0" max="100" value="100">
            <input type="range" id="sl-V" min="0" max="100" value="100">
        </div>
    </div>

    <!-- CIE 1931 區塊 -->
    <div class="section">
        <div class="section-title">CIE 1931 色座標 (亮度 Y 固定為 1)</div>
        <div class="input-group">
            <label>x</label>
            <input type="number" id="in-cX" min="0" max="0.8" step="0.0001" value="0.3127">
            <input type="range" id="sl-cX" min="0" max="0.8" step="0.0001" value="0.3127">
        </div>
        <div class="input-group">
            <label>y</label>
            <input type="number" id="in-cY" min="0" max="0.9" step="0.0001" value="0.3290">
            <input type="range" id="sl-cY" min="0" max="0.9" step="0.0001" value="0.3290">
        </div>
        <div class="info-text" id="mccamy-cct">估算相關色溫 (CCT): 6504 K (D65 白點)</div>
    </div>

    <!-- 普朗克軌跡黑體色溫 -->
    <div class="section">
        <div class="section-title">普朗克軌跡 (黑體輻射色溫)</div>
        <div class="input-group">
            <label>CCT</label>
            <input type="number" id="in-T" min="1000" max="15000" step="50" value="6500">
            <input type="range" id="sl-T" min="1000" max="15000" step="50" value="6500">
        </div>
        <div class="info-text">單位: 絕對溫度 Kelvin (K)。範圍: 1000K (紅) ~ 15000K (藍白)。</div>
    </div>
</div>

<script>
// --- 核心演算法：HSV ↔ RGB ---
function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, v = max;
    let d = max - min;
    s = max === 0 ? 0 : d / max;
    if (max === min) { h = 0; } 
    else {
        switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), v: Math.round(v * 100) };
}

function hsvToRgb(h, s, v) {
    h /= 360; s /= 100; v /= 100;
    let r, g, b;
    let i = Math.floor(h * 6);
    let f = h * 6 - i;
    let p = v * (1 - s);
    let q = v * (1 - f * s);
    let t = v * (1 - (1 - f) * s);
    switch (i % 6) {
        case 0: r = v; g = t; b = p; break;
        case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break;
        case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break;
        case 5: r = v; g = p; b = q; break;
    }
    return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
}

// --- 核心演算法：RGB ↔ CIE 1931 XYZ / xy ---
// sRGB 伽馬反轉 (Linearize)
function srgbInverseGamma(x) {
    x /= 255;
    return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
}
// sRGB 伽馬校正 (Compand)
function srgbGamma(x) {
    return x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1/2.4) - 0.055;
}

function rgbToXy(r, g, b) {
    let R = srgbInverseGamma(r);
    let G = srgbInverseGamma(g);
    let B = srgbInverseGamma(b);
    // sRGB 轉 XYZ 矩陣 (D65 白點)
    let X = R * 0.4124 + G * 0.3576 + B * 0.1805;
    let Y = R * 0.2126 + G * 0.7152 + B * 0.0722;
    let Z = R * 0.0193 + G * 0.1192 + B * 0.9505;
    let sum = X + Y + Z;
    if (sum === 0) return { x: 0.3127, y: 0.3290 }; // 預設白點
    return { x: X / sum, y: Y / sum };
}

function xyToRgb(x, y) {
    if (y === 0) y = 0.00001;
    let Y = 1.0; // 固定亮度為最大值進行色調投影
    let X = (x * Y) / y;
    let Z = ((1 - x - y) * Y) / y;
    // XYZ 轉 sRGB 矩陣
    let R = X * 3.2406 + Y * -1.5372 + Z * -0.4986;
    let G = X * -0.9689 + Y * 1.8758 + Z * 0.0415;
    let B = X * 0.0557 + Y * -0.2040 + Z * 1.0570;
    // 裁剪極端值並進行伽馬校正
    let r = Math.min(255, Math.max(0, Math.round(srgbGamma(R) * 255)));
    let g = Math.min(255, Math.max(0, Math.round(srgbGamma(G) * 255)));
    let b = Math.min(255, Math.max(0, Math.round(srgbGamma(B) * 255)));
    return { r, g, b };
}

// --- McCamy 公式：由 xy 座標反算色溫 CCT ---
function xyToCCT(x, y) {
    let n = (x - 0.3320) / (y - 0.1858);
    let cct = -449 * Math.pow(n, 3) + 3525 * Math.pow(n, 2) - 6823.3 * n + 5520.33;
    return cct > 0 && cct < 30000 ? Math.round(cct) : "超出計算範圍";
}

// --- 普朗克軌跡：由色溫 CCT 正算 CIE xy (Kang 近似公式修復版) ---
function cctToXy(T) {
    let x = 0.3127, y = 0.3290;
    // 防呆保護
    if(T < 1667) T = 1667;
    if(T > 25000) T = 25000;

    // 計算 x 座標
    if (T >= 1667 && T <= 4000) {
        x = -0.2661239 * (Math.pow(10, 9) / Math.pow(T, 3)) - 0.2343580 * (Math.pow(10, 6) / Math.pow(T, 2)) + 0.877380 * (1000 / T) + 0.179910;
    } else if (T > 4000 && T <= 25000) {
        x = -3.0258469 * (Math.pow(10, 9) / Math.pow(T, 3)) + 2.1070379 * (Math.pow(10, 6) / Math.pow(T, 2)) + 0.222634 * (1000 / T) + 0.240390;
    }
    
    // 依據軌跡求出 y 座標
    if (T >= 1667 && T <= 2222) {
        y = -1.1063814 * Math.pow(x, 3) - 1.34811020 * Math.pow(x, 2) + 2.185558 * x - 0.202196;
    } else if (T > 2222 && T <= 4000) {
        y = -0.9549476 * Math.pow(x, 3) - 1.37418593 * Math.pow(x, 2) + 2.091370 * x - 0.167488;
    } else {
        // 工程師補充：CCT > 4000K 時的 Y 座標對應公式
        y = 3.0817580 * Math.pow(x, 3) - 5.87338670 * Math.pow(x, 2) + 3.75112997 * x - 0.37001483;
    }
    return { x: parseFloat(x.toFixed(4)), y: parseFloat(y.toFixed(4)) };
}

// --- DOM 控制與界面聯動 ---
const doms = ['R','G','B','H','S','V','cX','cY','T'];
const el = {};
doms.forEach(id => {
    el[`in_${id}`] = document.getElementById(`in-${id}`);
    el[`sl_${id}`] = document.getElementById(`sl-${id}`);
});
const preview = document.getElementById('preview');
const txtCCT = document.getElementById('mccamy-cct');

function syncInputs(id, val) {
    el[`in_${id}`].value = val;
    el[`sl_${id}`].value = val;
}

// 核心 UI 更新函數
function updateUI(r, g, b, h, s, v, cx, cy, t) {
    syncInputs('R', r); syncInputs('G', g); syncInputs('B', b);
    syncInputs('H', h); syncInputs('S', s); syncInputs('V', v);
    syncInputs('cX', cx.toFixed(4)); syncInputs('cY', cy.toFixed(4));
    if(t) syncInputs('T', t);
    
    preview.style.backgroundColor = `rgb(${r},${g},${b})`;
    let calculatedCCT = xyToCCT(cx, cy);
    txtCCT.innerText = `估算相關色溫 (CCT): ${calculatedCCT} ${calculatedCCT !== "超出計算範圍" ? "K" : ""}`;
}

// --- 事件處理函式 ---

// 1. RGB 改變時觸發
function onRgbChange() {
    let r = parseInt(el.in_R.value), g = parseInt(el.in_G.value), b = parseInt(el.in_B.value);
    let hsv = rgbToHsv(r, g, b);
    let xy = rgbToXy(r, g, b);
    updateUI(r, g, b, hsv.h, hsv.s, hsv.v, xy.x, xy.y, null);
}

// 2. HSV 改變時觸發
function onHsvChange() {
    let h = parseInt(el.in_H.value), s = parseInt(el.in_S.value), v = parseInt(el.in_V.value);
    let rgb = hsvToRgb(h, s, v);
    let xy = rgbToXy(rgb.r, rgb.g, rgb.b);
    updateUI(rgb.r, rgb.g, rgb.b, h, s, v, xy.x, xy.y, null);
}

// 3. CIE xy 改變時觸發
function onXyChange() {
    let x = parseFloat(el.in_cX.value), y = parseFloat(el.in_cY.value);
    let rgb = xyToRgb(x, y);
    let hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
    updateUI(rgb.r, rgb.g, rgb.b, hsv.h, hsv.s, hsv.v, x, y, null);
}

// 4. 色溫 (CCT) 改變時觸發
function onCctChange() {
    let t = parseInt(el.in_T.value);
    let xy = cctToXy(t);
    let rgb = xyToRgb(xy.x, xy.y);
    let hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
    updateUI(rgb.r, rgb.g, rgb.b, hsv.h, hsv.s, hsv.v, xy.x, xy.y, t);
}

// --- 綁定事件監聽器 ---
function bindEvents() {
    const bindGroup = (ids, callback) => {
        ids.forEach(id => {
            // 綁定輸入框
            el[`in_${id}`].addEventListener('input', (e) => {
                el[`sl_${id}`].value = e.target.value;
                callback();
            });
            // 綁定拉桿
            el[`sl_${id}`].addEventListener('input', (e) => {
                el[`in_${id}`].value = e.target.value;
                callback();
            });
        });
    };

    bindGroup(['R', 'G', 'B'], onRgbChange);
    bindGroup(['H', 'S', 'V'], onHsvChange);
    bindGroup(['cX', 'cY'], onXyChange);
    bindGroup(['T'], onCctChange);
}

// 啟動工具初始化
bindEvents();
onRgbChange(); // 載入時用 RGB (255,255,255) 觸發初始計算

</script>
</body>
</html>
