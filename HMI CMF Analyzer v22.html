<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>HMI CMF Analyzer | V22 (Simulator Edition)</title>
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --panel-bg: #151515;
            --border-color: #2a2a2a;
            --text-main: #ccc;
            --font-mono: "JetBrains Mono", "SF Mono", monospace;
            --accent-blue: #007bff;
            --accent-green: #4ade80;
            --accent-orange: #ff9500;
            --sidebar-width: 380px;
        }

        /* 基礎佈局 */
        body { background: var(--bg-deep); color: var(--text-main); font-family: -apple-system, sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { height: 45px; background: #1a1a1a; display: flex; align-items: center; padding: 0 15px; gap: 10px; border-bottom: 1px solid var(--border-color); z-index: 100; }
        .app-container { flex: 1; display: flex; overflow: hidden; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 影片與畫布 */
        .video-section { flex: 1; position: relative; overflow: hidden; cursor: grab; background: #000; }
        .video-section:active { cursor: grabbing; }
        #canvas-container { position: absolute; transform-origin: 0 0; }
        canvas { display: block; background: #000; }

        /* UI 元件 */
        .btn-main { background: #333; color: #eee; border: 1px solid #444; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; transition: 0.2s; white-space: nowrap; }
        .btn-main:hover { background: #444; border-color: var(--accent-blue); }
        .input-text { background: #222; color: #fff; border: 1px solid #444; padding: 4px 8px; border-radius: 3px; font-size: 11px; width: 130px; }

        /* 標記與延伸線 */
        .marker-label { position: absolute; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 900; cursor: move; z-index: 20; display: flex; align-items: center; gap: 4px; border: 1.5px solid rgba(255,255,255,0.25); transform-origin: center center; box-shadow: 0 4px 10px #000; }
        .color-target { position: absolute; width: 6px; height: 6px; border: 1.5px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 15; pointer-events: none; transition: 0.1s; }
        .kernel-box { position: absolute; border: 1px dashed rgba(255,255,255,0.5); transform: translate(-50%, -50%); z-index: 14; pointer-events: none; }
        .leader-line { position: absolute; height: 1.5px; transform-origin: 0 50%; z-index: 10; pointer-events: none; margin-left: -0.5px; }
        .del-btn { cursor: pointer; opacity: 0.7; font-size: 12px; padding-left: 2px; }
        .del-btn:hover { opacity: 1; color: #ff6b6b; }

        /* 播放控制列 */
        .playback-controller { background: #111; padding: 12px 20px; border-top: 1px solid var(--border-color); }
        .automation-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #222; flex-wrap: wrap; }
        .controller-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #181818; padding: 6px 12px; border-radius: 4px; position: relative; }
        .track-label { width: 45px; font-size: 10px; color: #666; font-weight: bold; font-family: var(--font-mono); }
        
        /* 滑桿與尺度格線 */
        .slider-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
        input[type="range"] { width: 100%; height: 6px; accent-color: var(--accent-blue); cursor: pointer; z-index: 5; }
        .ticks { position: absolute; top: 14px; left: 0; width: 100%; height: 6px; display: flex; justify-content: space-between; pointer-events: none; z-index: 1; }
        .tick { width: 1px; height: 4px; background: #333; }
        .tick.major { height: 8px; background: #555; }
        .time-val { width: 85px; font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--accent-blue); }

        /* 右側數據面板 */
        .data-sidebar { width: var(--sidebar-width); background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .grid-container { flex: 1; overflow-y: auto; background: #0a0a0a; }
        table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11px; }
        th { position: sticky; top: 0; background: #222; padding: 10px 8px; text-align: left; color: #888; border-bottom: 1px solid #333; z-index: 10; }
        td { padding: 6px 8px; border-bottom: 1px solid #222; }
        
        /* Inline Editing ID Cell */
        .id-cell { font-weight: bold; transition: 0.2s; outline: none; border-radius: 2px; }
        .id-cell:hover { filter: brightness(1.3); cursor: text; border: 1px dashed rgba(255,255,255,0.4); }
        .id-cell:focus { background: rgba(255,255,255,0.1); border: 1px solid var(--accent-blue); }
        
        .sidebar-header { padding: 10px; border-bottom: 1px solid #222; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Checkbox style */
        .chk-label { display: flex; align-items: center; gap: 4px; cursor: pointer; font-family: var(--font-mono); color: #ccc; }
        .chk-label input { accent-color: var(--accent-orange); margin: 0; }
    </style>
</head>
<body>

    <header>
        <input type="file" id="file-upload" accept="video/mp4,video/quicktime" style="max-width: 180px;">
        <div style="width: 1px; height: 16px; background: #333; margin: 0 5px;"></div>
        <button class="btn-main" style="color:var(--accent-orange)" onclick="saveTemplate()">💾 儲存標籤配置</button>
        <button class="btn-main" style="color:var(--accent-orange)" onclick="document.getElementById('load-temp-input').click()">📂 載入配置</button>
        <input type="file" id="load-temp-input" accept=".json" style="display:none;" onchange="loadTemplate(this)">
        
        <div style="width: 1px; height: 16px; background: #333; margin: 0 5px;"></div>
        <!-- 模擬器控制區 -->
        <button id="btn-load-csv" class="btn-main" style="background:#222; color:var(--accent-green); font-weight:bold;" onclick="document.getElementById('csv-upload').click()">📥 載入 CSV (模擬器)</button>
        <input type="file" id="csv-upload" accept=".csv" style="display:none;" onchange="loadSimulationCSV(this)">
        <button id="sim-off-btn" class="btn-main" onclick="exitSimulator()" style="display:none; background:#ff4444; color:#fff; border-color:#ff4444;">🛑 關閉模擬</button>
        <span id="sim-status" style="font-size:11px; color:var(--accent-green); font-weight:bold; display:none; animation: pulse 1.5s infinite;">● 模擬運作中</span>

        <div style="flex:1"></div>
        <span id="zoom-info" style="font-size: 11px; color: #555; margin-right: 15px;">Zoom: 100%</span>
        <button class="btn-main" onclick="clearAll()" style="color:#ff6b6b">全部清除</button>
    </header>

    <div class="app-container">
        <div class="main-content">
            <div class="video-section" id="viewport">
                <div id="canvas-container">
                    <canvas id="canvas"></canvas>
                    <!-- 疊影圖層 -->
                    <img id="segment-map" style="position:absolute; top:0; left:0; transform-origin: 0 0; z-index: 5; display:none; opacity:0.5; pointer-events:none;">
                    <div id="overlay"></div>
                </div>
            </div>

            <footer class="playback-controller">
                <div class="automation-toolbar">
                    <button id="set-start-btn" class="btn-main" onclick="setStartFrame()">1. 起始 (A)</button>
                    <button id="set-end-btn" class="btn-main" onclick="setEndFrame()">2. 結束 (B)</button>
                    <span id="range-hint" style="font-size: 11px; color: #777; min-width: 100px;">[0.000, End]</span>
                    
                    <div style="width: 1px; height: 16px; background: #333; margin: 0 5px;"></div>
                    <input type="text" id="project-link" class="input-text" placeholder="專案名稱或連結">
                    
                    <!-- 升級: 動態勾選匯出欄位 -->
                    <div style="display:flex; align-items:center; gap:8px; background:#222; padding:4px 8px; border-radius:4px; border: 1px solid #444;">
                        <span style="font-size:10px; color:#888;">匯出:</span>
                        <label class="chk-label"><input type="checkbox" id="exp-v" checked> V%</label>
                        <label class="chk-label"><input type="checkbox" id="exp-h"> H°</label>
                        <label class="chk-label"><input type="checkbox" id="exp-s"> S%</label>
                        <label class="chk-label"><input type="checkbox" id="exp-hex"> HEX</label>
                    </div>

                    <select id="export-interval" class="btn-main" style="background:#222; color:white">
                        <option value="0.033333">約 30 FPS</option>
                        <option value="0.016666">約 60 FPS</option>
                        <option value="0.030" selected>固定 30ms</option>
                        <option value="0.040">固定 40ms</option>
                    </select>
                    <button class="btn-main" onclick="runSequenceExport()" style="color:#000; background:var(--accent-orange); border-color:var(--accent-orange); font-weight:bold;">執行 CSV 轉換匯出</button>
                    <span id="export-progress" style="font-size: 11px; color: var(--accent-blue); display: none;">處理中...</span>
                </div>

                <div class="controller-row">
                    <div class="track-label">1ms</div>
                    <button class="btn-main" onclick="step(-0.001)">-1</button>
                    <div class="slider-wrapper"><input type="range" id="seek-1ms" step="0.001" value="0"></div>
                    <button class="btn-main" onclick="step(0.001)">+1</button>
                    <div class="time-val" id="time-1ms">0.000s</div>
                </div>
                <div class="controller-row">
                    <div class="track-label">30ms</div>
                    <button class="btn-main" onclick="step(-0.030)">-30</button>
                    <div class="slider-wrapper">
                        <input type="range" id="seek-30ms" step="0.030" value="0">
                        <div id="ticks-30ms" class="ticks"></div>
                    </div>
                    <button class="btn-main" onclick="step(0.030)">+30</button>
                    <div class="time-val" id="time-30ms">0.000s</div>
                </div>
            </footer>
        </div>

        <aside class="data-sidebar">
            <!-- 疊影控制面板 -->
            <div class="sidebar-header" style="flex-direction: column; align-items: stretch; gap: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color:#eee; font-weight:bold; font-size: 12px;">🗺️ 輔助疊影對位</span>
                    <button class="btn-main" onclick="document.getElementById('map-upload').click()">載入 PNG</button>
                    <input type="file" id="map-upload" accept="image/png,image/jpeg" style="display:none">
                </div>
                <div id="map-controls" style="display:none; flex-direction: column; gap: 8px; background: #1a1a1a; padding: 8px; border-radius: 4px; border: 1px solid #333;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <button id="btn-map-edit" class="btn-main" style="flex:1; border-color: var(--border-color); color: var(--text-main);" onclick="toggleMapEdit()">解鎖對位 (目前: 鎖定)</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px; font-size: 10px;">
                        <span style="width: 30px;">透明</span>
                        <input type="range" id="map-opacity" min="0" max="1" step="0.05" value="0.5" style="flex:1;" oninput="updateMapOpacity()">
                    </div>
                    <div id="map-hint" style="font-size: 10px; color:#777; text-align:center; display:none;">
                        🔥 編輯中：在左側畫布直接 <b>拖曳</b> / <b>滾輪縮放</b> PNG
                    </div>
                </div>
            </div>

            <div class="sidebar-header">
                <span style="color:#888; font-size:10px;">SPACE: 播放 | 點擊 ID 直接改名</span>
                <select id="kernel-size" class="btn-main" style="border:none; background:#222;" onchange="forceRedraw()">
                    <option value="1">取樣: 1x1 單點</option>
                    <option value="3" selected>取樣: 3x3 平均 (降噪)</option>
                    <option value="5">取樣: 5x5 平均</option>
                </select>
            </div>
            <div class="grid-container">
                <table>
                    <thead>
                        <tr><th>ID (Name)</th><th>H°</th><th>V%</th><th>S%</th><th>Color</th></tr>
                    </thead>
                    <tbody id="grid-body"></tbody>
                </table>
            </div>
        </aside>
    </div>

    <input type="color" id="mac-color-picker" style="display:none">
    <video id="v" style="display:none" crossorigin="anonymous" playsinline muted></video>

    <style>
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>

    <script>
        // DOM 節點初始化
        const v = document.getElementById('v');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { colorSpace: 'srgb', willReadFrequently: true });
        const container = document.getElementById('canvas-container');
        const overlay = document.getElementById('overlay');
        const viewport = document.getElementById('viewport');
        const gridBody = document.getElementById('grid-body');
        const colorPicker = document.getElementById('mac-color-picker');
        const kernelSelect = document.getElementById('kernel-size');
        
        // 疊影相關節點
        const segmentMap = document.getElementById('segment-map');
        const mapUpload = document.getElementById('map-upload');
        const mapControls = document.getElementById('map-controls');
        
        const seeks = { '1ms': document.getElementById('seek-1ms'), '30ms': document.getElementById('seek-30ms') };
        const timeVals = { '1ms': document.getElementById('time-1ms'), '30ms': document.getElementById('time-30ms') };

        // 全域狀態
        let state = {
            scale: 1, offsetX: 0, offsetY: 0, 
            points: [], 
            isPanning: false, isUserSeeking: false, isExporting: false,
            startKeyTime: 0, endKeyTime: Infinity,
            // 模擬器狀態
            simulatorActive: false,
            simulationData: null
        };

        // 疊影系統狀態
        let mapState = {
            active: false, isEditing: false, x: 0, y: 0, scale: 1, isDragging: false, startX: 0, startY: 0
        };

        // --- 核心演算法：色彩空間轉換 ---
        function rgbToHsvPrecision(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
            let h = 0, s = (max === 0 ? 0 : d / max), v = max;
            if (d !== 0) {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), v: Math.round(v * 100) };
        }

        // HSV 轉 RGB (用於模擬器精準回放)
        function hsvToRgb(h, s, v) {
            h = (h % 360 + 360) % 360; 
            s = Math.max(0, Math.min(100, s)) / 100;
            v = Math.max(0, Math.min(100, v)) / 100;
            let c = v * s;
            let x = c * (1 - Math.abs((h / 60) % 2 - 1));
            let m = v - c;
            let r=0, g=0, b=0;
            if(h>=0 && h<60){ r=c; g=x; b=0; }
            else if(h>=60 && h<120){ r=x; g=c; b=0; }
            else if(h>=120 && h<180){ r=0; g=c; b=x; }
            else if(h>=180 && h<240){ r=0; g=x; b=c; }
            else if(h>=240 && h<300){ r=x; g=0; b=c; }
            else { r=c; g=0; b=x; } 
            return { r: Math.round((r+m)*255), g: Math.round((g+m)*255), b: Math.round((b+m)*255) };
        }

        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
        }

        function getAverageRGB(cx, cy, kernelSize) {
            cx = Math.floor(cx); cy = Math.floor(cy);
            if (kernelSize === 1) {
                const p = ctx.getImageData(cx, cy, 1, 1).data;
                return { r: p[0], g: p[1], b: p[2] };
            }
            const half = Math.floor(kernelSize / 2);
            const startX = Math.max(0, cx - half);
            const startY = Math.max(0, cy - half);
            const w = Math.min(canvas.width - startX, kernelSize);
            const h = Math.min(canvas.height - startY, kernelSize);
            
            const imgData = ctx.getImageData(startX, startY, w, h).data;
            let r=0, g=0, b=0, count=0;
            for (let i = 0; i < imgData.length; i += 4) {
                r += imgData[i]; g += imgData[i+1]; b += imgData[i+2]; count++;
            }
            return { r: Math.round(r/count), g: Math.round(g/count), b: Math.round(b/count) };
        }

        // --- 視角與渲染 ---
        function forceRedraw() {
            if (v.readyState < 2) return;
            // 模擬模式下可以選擇不要刷新影片底圖，或照常刷新以利比對
            ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
            renderMarkers();
            updateGrid();
        }

        function animate() {
            if (!v.paused && !v.ended && !state.isExporting && !state.isUserSeeking) {
                forceRedraw();
                syncAllSeekbars(v.currentTime);
            }
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        document.getElementById('file-upload').onchange = e => {
            const file = e.target.files[0];
            if (file) { v.src = URL.createObjectURL(file); v.load(); }
        };

        v.onloadedmetadata = () => {
            canvas.width = v.videoWidth;
            canvas.height = v.videoHeight;
            Object.values(seeks).forEach(s => { s.max = v.duration; s.value = 0; });
            createTicks('30ms', 30);
            resetZoom();
            setTimeout(() => { v.currentTime = 0.001; }, 100); 
        };

        v.onseeked = () => forceRedraw();

        function createTicks(id, count) {
            const el = document.getElementById(`ticks-${id}`);
            if (!el) return;
            el.innerHTML = '';
            for(let i=0; i<=count; i++) {
                const t = document.createElement('div');
                t.className = 'tick' + (i % 5 === 0 ? ' major' : '');
                el.appendChild(t);
            }
        }

        window.onkeydown = e => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT' && !e.target.isContentEditable) {
                e.preventDefault();
                v.paused ? v.play() : v.pause();
            }
        };

        Object.keys(seeks).forEach(key => {
            const el = seeks[key];
            el.onmousedown = () => state.isUserSeeking = true;
            el.onmouseup = () => state.isUserSeeking = false;
            el.oninput = e => {
                let val = parseFloat(e.target.value);
                if (key === '30ms') val = Math.round(val / 0.03) * 0.03;
                v.currentTime = val;
                syncAllSeekbars(val);
                forceRedraw();
            };
        });

        function syncAllSeekbars(t) {
            Object.keys(seeks).forEach(k => {
                seeks[k].value = t;
                timeVals[k].innerText = t.toFixed(3) + 's';
            });
        }

        function step(s) {
            v.currentTime = Math.max(0, Math.min(v.duration, v.currentTime + s));
            syncAllSeekbars(v.currentTime);
            forceRedraw();
        }

        // --- 疊影系統功能 ---
        mapUpload.onchange = e => {
            const file = e.target.files[0];
            if (file) {
                segmentMap.src = URL.createObjectURL(file);
                segmentMap.style.display = 'block';
                mapControls.style.display = 'flex';
                mapState.active = true;
                
                segmentMap.onload = () => {
                    const scaleX = canvas.width / segmentMap.naturalWidth;
                    const scaleY = canvas.height / segmentMap.naturalHeight;
                    mapState.scale = Math.min(scaleX, scaleY) * 0.8;
                    mapState.x = (canvas.width - segmentMap.naturalWidth * mapState.scale) / 2;
                    mapState.y = (canvas.height - segmentMap.naturalHeight * mapState.scale) / 2;
                    updateMapTransform();
                }
            }
        };

        function toggleMapEdit() {
            mapState.isEditing = !mapState.isEditing;
            const btn = document.getElementById('btn-map-edit');
            const hint = document.getElementById('map-hint');
            if (mapState.isEditing) {
                btn.style.background = 'var(--accent-orange)'; btn.style.color = '#000';
                btn.innerText = '🔒 結束對位 (目前: 編輯中)'; hint.style.display = 'block';
            } else {
                btn.style.background = '#333'; btn.style.color = 'var(--accent-orange)';
                btn.innerText = '🔓 解鎖對位 (目前: 鎖定)'; hint.style.display = 'none';
            }
        }

        function updateMapOpacity() { segmentMap.style.opacity = document.getElementById('map-opacity').value; }
        function updateMapTransform() { segmentMap.style.transform = `translate(${mapState.x}px, ${mapState.y}px) scale(${mapState.scale})`; }

        // --- 畫布平移縮放與疊影編輯核心 ---
        function resetZoom() {
            state.scale = viewport.clientWidth / canvas.width;
            state.offsetX = (viewport.clientWidth - canvas.width * state.scale) / 2;
            state.offsetY = (viewport.clientHeight - canvas.height * state.scale) / 2;
            updateTransform();
        }

        function updateTransform() {
            container.style.transform = `translate(${state.offsetX}px, ${state.offsetY}px) scale(${state.scale})`;
            document.getElementById('zoom-info').innerText = `Zoom: ${Math.round(state.scale*100)}%`;
            renderMarkers();
        }

        viewport.onwheel = e => {
            e.preventDefault();
            if (mapState.active && mapState.isEditing) {
                const mx = (e.clientX - state.offsetX) / state.scale, my = (e.clientY - state.offsetY) / state.scale;
                const mapCx = (mx - mapState.x) / mapState.scale, mapCy = (my - mapState.y) / mapState.scale;
                const delta = e.deltaY > 0 ? -0.05 : 0.05; 
                mapState.scale = Math.max(0.01, mapState.scale + mapState.scale * delta);
                mapState.x = mx - mapCx * mapState.scale; mapState.y = my - mapCy * mapState.scale;
                updateMapTransform(); return;
            }
            const rect = viewport.getBoundingClientRect();
            const mx = e.clientX - rect.left, my = e.clientY - rect.top;
            const cx = (mx - state.offsetX) / state.scale, cy = (my - state.offsetY) / state.scale;
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            state.scale = Math.max(0.05, Math.min(10, state.scale + delta));
            state.offsetX = mx - cx * state.scale; state.offsetY = my - cy * state.scale;
            updateTransform();
        };

        viewport.onmousedown = e => {
            if (e.target.closest('.del-btn')) return;
            const rect = canvas.getBoundingClientRect();
            if (mapState.active && mapState.isEditing) {
                mapState.isDragging = true; viewport.style.cursor = 'move';
                mapState.startX = (e.clientX - state.offsetX) / state.scale - mapState.x;
                mapState.startY = (e.clientY - state.offsetY) / state.scale - mapState.y;
                return;
            }
            const mx = (e.clientX - rect.left) / state.scale, my = (e.clientY - rect.top) / state.scale;
            const hitIdx = state.points.findIndex(p => Math.hypot(p.tx - mx, p.ty - my) < 15/state.scale);
            if (hitIdx !== -1) { state.dragTarget = { i: hitIdx, type: 'tx' }; return; }
            const labelIdx = state.points.findIndex(p => Math.hypot(p.lx - mx, p.ly - my) < 25/state.scale);
            if (labelIdx !== -1) { state.dragTarget = { i: labelIdx, type: 'lx' }; return; }
            state.isPanning = true;
            state.panStart = { x: e.clientX - state.offsetX, y: e.clientY - state.offsetY, mX: e.clientX, mY: e.clientY };
        };

        window.onmousemove = e => {
            if (mapState.active && mapState.isEditing && mapState.isDragging) {
                mapState.x = (e.clientX - state.offsetX) / state.scale - mapState.startX;
                mapState.y = (e.clientY - state.offsetY) / state.scale - mapState.startY;
                updateMapTransform(); return;
            }
            if (state.dragTarget) {
                const rect = canvas.getBoundingClientRect();
                const p = state.points[state.dragTarget.i];
                if (state.dragTarget.type === 'tx') { p.tx = (e.clientX - rect.left) / state.scale; p.ty = (e.clientY - rect.top) / state.scale; } 
                else { p.lx = (e.clientX - rect.left) / state.scale; p.ly = (e.clientY - rect.top) / state.scale; }
                renderMarkers(); updateGrid();
            } else if (state.isPanning) {
                state.offsetX = e.clientX - state.panStart.x; state.offsetY = e.clientY - state.panStart.y;
                updateTransform();
            }
        };

        window.onmouseup = e => {
            if (mapState.active && mapState.isEditing && mapState.isDragging) {
                mapState.isDragging = false; viewport.style.cursor = 'grab'; return;
            }
            if (state.isPanning && Math.hypot(e.clientX - state.panStart.mX, e.clientY - state.panStart.mY) < 5) {
                const rect = canvas.getBoundingClientRect();
                const tx = (e.clientX - rect.left) / state.scale, ty = (e.clientY - rect.top) / state.scale;
                const defaultName = `Seg_${state.points.length+1}`;
                state.points.push({ tx, ty, lx: tx + 35/state.scale, ly: ty - 35/state.scale, name: defaultName, customColor: null });
                renderMarkers(); forceRedraw();
            }
            state.dragTarget = null; state.isPanning = false;
        };

        // --- CSV 模擬器核心 ---
        function loadSimulationCSV(input) {
            if(!input.files[0]) return;
            const reader = new FileReader();
            reader.onload = e => {
                const text = e.target.result;
                const rows = text.split('\n').map(r => r.split(','));
                
                // 找 ms 時間軸
                let msRowIdx = rows.findIndex(r => r[0] && r[0].replace(/[\W_]+/g,"").toLowerCase() === 'ms');
                if (msRowIdx === -1) msRowIdx = 1; // Fallback
                
                const times = rows[msRowIdx].slice(1).map(Number).filter(n => !isNaN(n));
                const tracks = {};

                for (let i = msRowIdx + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 2) continue;
                    const rawName = row[0].replace(/^["'\s\uFEFF]+|["'\s]+$/g, '');
                    if (!rawName) continue;
                    tracks[rawName] = row.slice(1).map(v => v ? v.replace(/^["'\s]+|["'\s]+$/g, '') : '0');
                }
                
                state.simulationData = { times, tracks };
                state.simulatorActive = true;
                
                document.getElementById('sim-status').style.display = 'inline';
                document.getElementById('sim-off-btn').style.display = 'inline-block';
                document.getElementById('btn-load-csv').style.display = 'none';

                // 自動生成標記點 (如果畫布是空的)
                if (state.points.length === 0) {
                    let idx = 0;
                    const baseNames = new Set();
                    Object.keys(tracks).forEach(k => {
                        const clean = k.replace(/_(H|S|V|HEX)$/, '');
                        baseNames.add(clean);
                    });
                    baseNames.forEach(name => {
                        const tx = 100 + (idx % 10) * 80, ty = 100 + Math.floor(idx / 10) * 80;
                        state.points.push({ tx, ty, lx: tx, ly: ty - 20, name: name, customColor: null });
                        idx++;
                    });
                    resetZoom();
                }
                forceRedraw();
            };
            reader.readAsText(input.files[0]);
            input.value = "";
        }

        function exitSimulator() {
            state.simulatorActive = false;
            state.simulationData = null;
            document.getElementById('sim-status').style.display = 'none';
            document.getElementById('sim-off-btn').style.display = 'none';
            document.getElementById('btn-load-csv').style.display = 'inline-block';
            forceRedraw();
        }

        // --- 標記與網格渲染 ---
        function getPointStyle(i) {
            const p = state.points[i];
            
            // Simulator Mode Override
            if (state.simulatorActive && state.simulationData) {
                const t = v.currentTime * 1000;
                const times = state.simulationData.times;
                
                let closestIdx = 0, minDiff = Infinity;
                for(let j=0; j<times.length; j++) {
                    const diff = Math.abs(times[j] - t);
                    if(diff < minDiff) { minDiff = diff; closestIdx = j; }
                }
                
                const tracks = state.simulationData.tracks;
                const pName = p.name;
                let r=0, g=0, b=0, found=false, isSim=true;
                let simH = '-', simS = '-', simV = '-';
                
                // 找 HEX
                if (tracks[pName + '_HEX'] || (tracks[pName] && tracks[pName][closestIdx] && tracks[pName][closestIdx].startsWith('#'))) {
                    const hexStr = tracks[pName + '_HEX'] ? tracks[pName + '_HEX'][closestIdx] : tracks[pName][closestIdx];
                    if (hexStr && hexStr.startsWith('#')) {
                        r = parseInt(hexStr.slice(1,3), 16); g = parseInt(hexStr.slice(3,5), 16); b = parseInt(hexStr.slice(5,7), 16);
                        found = true;
                        simH = 'HEX'; simS = 'HEX'; simV = 'HEX';
                    }
                }
                
                // 找 HSV 或 僅 V (灰階亮度)
                if (!found) {
                    let vVal = null, hVal = null, sVal = null;
                    if (tracks[pName + '_V']) vVal = parseFloat(tracks[pName + '_V'][closestIdx]);
                    else if (tracks[pName]) vVal = parseFloat(tracks[pName][closestIdx]);
                    
                    if (tracks[pName + '_H']) hVal = parseFloat(tracks[pName + '_H'][closestIdx]);
                    if (tracks[pName + '_S']) sVal = parseFloat(tracks[pName + '_S'][closestIdx]);
                    
                    if (vVal !== null && !isNaN(vVal)) {
                        // 修正：如果沒有 S 卻有 H，預設 S 給 100 讓色相發色；否則 S 給 0 (灰階)
                        let effectiveS = sVal !== null ? sVal : (hVal !== null ? 100 : 0);
                        let effectiveH = hVal !== null ? hVal : 0;
                        
                        const rgb = hsvToRgb(effectiveH, effectiveS, vVal);
                        r = rgb.r; g = rgb.g; b = rgb.b;
                        found = true;
                        
                        simH = hVal !== null ? hVal : '-';
                        simS = sVal !== null ? sVal : '-';
                        simV = vVal !== null ? vVal : '-';
                    }
                }
                
                if (found) {
                    const bg = `rgb(${r},${g},${b})`;
                    const lum = (r*0.299 + g*0.587 + b*0.114);
                    return { bg, text: lum > 150 ? "#000" : "#fff", isSim: true, simH, simS, simV };
                }
            }

            // Normal Mode
            const hue = (i * 137.5) % 360;
            const sat = Math.max(30, 85 - (i * 0.5)), light = Math.max(45, 65 - (i * 0.15));
            const bg = p.customColor || `hsl(${hue}, ${sat}%, ${light}%)`;
            let r=0, g=0, b=0;
            if (p.customColor) {
                r = parseInt(p.customColor.slice(1,3), 16); g = parseInt(p.customColor.slice(3,5), 16); b = parseInt(p.customColor.slice(5,7), 16);
            } else {
                r = g = b = light > 62 ? 200 : 50;
            }
            const lum = (r * 0.299 + g * 0.587 + b * 0.114);
            return { bg, text: lum > 150 ? "#000" : "#fff", isSim: false };
        }

        function renderMarkers() {
            overlay.innerHTML = '';
            const kernelSize = parseInt(kernelSelect.value);

            state.points.forEach((p, i) => {
                const s = getPointStyle(i);
                
                const target = document.createElement('div');
                target.className = 'color-target'; target.style.left = p.tx+'px'; target.style.top = p.ty+'px';
                
                // 模擬器模式視覺強化 (發光點)
                if (s.isSim) {
                    target.style.background = s.bg;
                    target.style.border = 'none';
                    target.style.width = '14px'; target.style.height = '14px';
                    target.style.boxShadow = `0 0 12px ${s.bg}, 0 0 4px #fff`;
                } else {
                    target.style.borderColor = s.bg;
                }
                overlay.appendChild(target);

                if (kernelSize > 1 && !state.simulatorActive) {
                    const kBox = document.createElement('div');
                    kBox.className = 'kernel-box'; kBox.style.left = p.tx+'px'; kBox.style.top = p.ty+'px';
                    kBox.style.width = kernelSize+'px'; kBox.style.height = kernelSize+'px';
                    overlay.appendChild(kBox);
                }

                const label = document.createElement('div');
                label.className = 'marker-label'; label.style.left = p.lx+'px'; label.style.top = p.ly+'px';
                label.style.transform = `translate(-50%, -50%) scale(${1/state.scale})`;
                label.style.background = s.bg; label.style.color = s.text;
                // Inline Edit Icon
                label.innerHTML = `${p.name} <span class="del-btn" onclick="state.points.splice(${i},1);renderMarkers();forceRedraw()">×</span>`;
                overlay.appendChild(label);

                const line = document.createElement('div');
                line.className = 'leader-line';
                const dx = p.lx - p.tx, dy = p.ly - p.ty;
                const dist = Math.sqrt(dx*dx + dy*dy), ang = Math.atan2(dy, dx);
                line.style.width = dist+'px'; line.style.left = p.tx+'px'; line.style.top = p.ty+'px';
                line.style.transform = `rotate(${ang}rad)`;
                line.style.background = `linear-gradient(90deg, #fff, ${s.bg})`;
                overlay.appendChild(line);
            });
        }

        // Inline Name Editing Function
        window.updatePointName = function(idx, newName) {
            state.points[idx].name = newName.trim() || `Seg_${idx+1}`;
            renderMarkers(); 
            // no updateGrid here to prevent focus loss during typing, handled properly via UI flow
        }

        function updateGrid() {
            let html = "";
            const kernelSize = parseInt(kernelSelect.value);

            state.points.forEach((p, i) => {
                const s = getPointStyle(i);
                let hsv = { h: '-', s: '-', v: '-' }, swatch = "transparent";
                let dispH = '-', dispS = '-', dispV = '-';
                
                // 若為模擬模式，數據與色塊將顯示為模擬結果
                if (s.isSim) {
                    dispH = s.simH; dispS = s.simS; dispV = s.simV;
                    swatch = s.bg;
                } else if (p.tx >= 0 && p.tx < canvas.width && p.ty >= 0 && p.ty < canvas.height) {
                    const {r, g, b} = getAverageRGB(p.tx, p.ty, kernelSize);
                    hsv = rgbToHsvPrecision(r, g, b);
                    swatch = `rgb(${r},${g},${b})`;
                    dispH = hsv.h; dispS = hsv.s; dispV = hsv.v;
                }

                let formatVal = (v, unit) => (v !== '-' && v !== 'HEX') ? v + unit : v;

                html += `<tr>
                    <td class="id-cell" style="background:${s.bg}; color:${s.text}" contenteditable="true" onblur="updatePointName(${i}, this.innerText)">${p.name}</td>
                    <td style="color:#fff">${formatVal(dispH, '°')}</td>
                    <td style="color:#fff">${formatVal(dispV, '%')}</td>
                    <td style="color:#888">${formatVal(dispS, '%')}</td>
                    <td><div style="width:20px;height:10px;background:${swatch};border-radius:2px; border:1px solid #333"></div></td>
                </tr>`;
            });
            gridBody.innerHTML = html;
        }

        // --- 模板與匯出功能 ---
        function clearAll() { state.points = []; state.startKeyTime = 0; state.endKeyTime = Infinity; renderMarkers(); updateRangeHint(); forceRedraw(); }
        
        function saveTemplate() {
            if(state.points.length === 0) return alert("無標籤可儲存");
            const data = JSON.stringify(state.points.map(p => ({ tx: p.tx, ty: p.ty, lx: p.lx, ly: p.ly, name: p.name, customColor: p.customColor })));
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = `HMI_Dash_Template.json`; a.click();
        }

        function loadTemplate(input) {
            if(!input.files[0]) return;
            const reader = new FileReader();
            reader.onload = e => { state.points = JSON.parse(e.target.result); renderMarkers(); forceRedraw(); };
            reader.readAsText(input.files[0]);
            input.value = "";
        }

        function setStartFrame() { state.startKeyTime = v.currentTime; updateRangeHint(); }
        function setEndFrame() { state.endKeyTime = v.currentTime; updateRangeHint(); }
        function updateRangeHint() { document.getElementById('range-hint').innerText = `[${state.startKeyTime.toFixed(3)}, ${state.endKeyTime === Infinity ? 'End' : state.endKeyTime.toFixed(3)}]`; }

        // 自訂格式匯出 (V22 Checkbox Logic)
        async function runSequenceExport() {
            if (state.points.length === 0) return alert("請先標記點位");
            state.isExporting = true;
            
            const expV = document.getElementById('exp-v').checked;
            const expH = document.getElementById('exp-h').checked;
            const expS = document.getElementById('exp-s').checked;
            const expHex = document.getElementById('exp-hex').checked;
            
            if(!expV && !expH && !expS && !expHex) {
                state.isExporting = false; return alert("請至少勾選一項匯出欄位");
            }

            const interval = parseFloat(document.getElementById('export-interval').value);
            const kernelSize = parseInt(kernelSelect.value);
            const projectLink = document.getElementById('project-link').value || '';
            const progress = document.getElementById('export-progress');
            progress.style.display = 'inline';
            
            let timeRow = ['ms'];
            let rowObjects = []; 

            state.points.forEach((p, i) => {
                const n = p.name;
                const isMulti = (expV + expH + expS + expHex) > 1;
                // If only V is checked, use raw name for easier LUT parsing. Otherwise append suffix.
                if (expV) rowObjects.push({ name: (isMulti ? `${n}_V` : n), data: [(isMulti ? `${n}_V` : n)], type: 'V' });
                if (expH) rowObjects.push({ name: `${n}_H`, data: [`${n}_H`], type: 'H' });
                if (expS) rowObjects.push({ name: `${n}_S`, data: [`${n}_S`], type: 'S' });
                if (expHex) rowObjects.push({ name: `${n}_HEX`, data: [`${n}_HEX`], type: 'HEX' });
            });

            let curT = state.startKeyTime;
            const endT = Math.min(v.duration, state.endKeyTime);

            while (curT <= endT) {
                v.currentTime = curT;
                await new Promise(r => v.onseeked = r);
                ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
                
                const timeStr = Math.round((curT - state.startKeyTime) * 1000);
                timeRow.push(timeStr);

                let pIdx = 0;
                state.points.forEach((p) => {
                    const {r, g, b} = getAverageRGB(p.tx, p.ty, kernelSize);
                    const hsv = rgbToHsvPrecision(r, g, b);
                    const hex = rgbToHex(r,g,b);
                    
                    if (expV) { rowObjects[pIdx].data.push(hsv.v); pIdx++; }
                    if (expH) { rowObjects[pIdx].data.push(hsv.h); pIdx++; }
                    if (expS) { rowObjects[pIdx].data.push(hsv.s); pIdx++; }
                    if (expHex) { rowObjects[pIdx].data.push(hex); pIdx++; }
                });
                
                curT += interval;
                progress.innerText = `處理中: ${Math.round(((curT-state.startKeyTime)/(endT-state.startKeyTime))*100)}%`;
            }

            let csvContent = "\uFEFF"; 
            csvContent += projectLink + ','.repeat(timeRow.length - 1) + '\n'; 
            csvContent += timeRow.join(',') + '\n';                            
            rowObjects.forEach(r => {
                csvContent += r.data.join(',') + '\n';                         
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = `HMI_Matrix_${Date.now()}.csv`; 
            a.click();
            URL.revokeObjectURL(url);

            state.isExporting = false; progress.style.display = 'none';
        }

        window.onresize = resetZoom;
    </script>
</body>
</html>
