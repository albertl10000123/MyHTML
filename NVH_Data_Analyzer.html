<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. | NVH Full-Spectrum & Kinematic Analyzer</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #58a6ff;
            --text-muted: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --warning: #d29922;
            --rpm-color: #ff7b72;
            --fft-color: #a371f7;
            --kinematic-belt: #00ffcc;
            --kinematic-gear: #ff9900;
        }
        
        body { font-family: 'Consolas', 'Courier New', monospace; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1500px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .control-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        
        .kinematic-params { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;}
        .param-item { display: flex; align-items: center; gap: 5px; }
        .param-item input { width: 70px; background: #0d1117; color: #fff; border: 1px solid #30363d; padding: 3px 5px; border-radius: 3px; font-family: inherit;}

        .file-input-group { display: flex; flex-direction: column; gap: 10px; }
        label { font-weight: bold; color: var(--text-muted); font-size: 0.9rem; }
        input[type="file"] { color: #c9d1d9; padding: 10px; border: 1px dashed var(--border-color); border-radius: 4px; background: rgba(0,0,0,0.2); cursor: pointer; }
        button { background-color: var(--accent); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-family: inherit; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; width: 100%; margin-bottom: 10px; }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: var(--border-color); cursor: not-allowed; color: var(--text-muted); }
        
        .plot-container { width: 100%; height: 500px; margin-bottom: 20px; }
        #plotTime { height: 400px; }
        #plotPSD { height: 400px; }
        #plotSpectrogram, #plotOrder { height: 600px; }
        
        .status { margin-top: 10px; font-size: 0.9rem; color: var(--warning); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .playback-controls { background: rgba(31, 111, 235, 0.1); padding: 10px; border: 1px solid rgba(31, 111, 235, 0.3); border-radius: 4px; display: flex; gap: 15px; align-items: center; margin-bottom: 10px;}
        .denoise-controls { background: rgba(163, 113, 247, 0.1); padding: 10px; border: 1px solid rgba(163, 113, 247, 0.3); border-radius: 4px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;}
        .time-display { font-size: 1.2rem; font-weight: bold; color: #00ffcc; min-width: 120px; text-align: right; }
        
        .checkbox-container { display: flex; align-items: center; cursor: pointer; color: #fff; font-weight: bold; }
        .checkbox-container input { width: 18px; height: 18px; margin-right: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>NVH Multimodal & Kinematic Analyzer</h1>
            <div style="color: var(--text-muted); font-size: 0.9rem;">GGR Powertrain Spec: 21/74T Gear | 24/59T Belt</div>
        </div>

        <div class="panel">
            <div class="kinematic-params">
                <span style="color: #fff; font-weight: bold;">Kinematic Setup (Teeth):</span>
                <div class="param-item"><label>Motor Gear</label><input type="number" id="tMotor" value="21"></div>
                <div class="param-item"><label>Out Gear</label><input type="number" id="tOut" value="74"></div>
                <div class="param-item"><label>Front Pulley</label><input type="number" id="tFrontPulley" value="24"></div>
                <div style="color: var(--kinematic-belt); margin-left: 10px; font-size: 0.9rem;">Belt Order: <span id="calcBeltOrder">6.81</span></div>
                <div style="color: var(--kinematic-gear); margin-left: 10px; font-size: 0.9rem;">Gear Order: <span id="calcGearOrder">21.00</span></div>
            </div>

            <div class="control-grid">
                <div class="file-input-group">
                    <label>1. 載入背景噪音 (CSV) [若要濾除則必填]</label>
                    <input type="file" id="fileBg" accept=".csv">
                </div>
                <div class="file-input-group">
                    <label>2. 載入目標分析音檔 (CSV) [必填]</label>
                    <input type="file" id="fileSlide" accept=".csv">
                </div>
                <div class="file-input-group">
                    <label>3. 載入車輛通訊 (CAN TRC) [選填]</label>
                    <input type="file" id="fileCAN" accept=".trc">
                </div>
            </div>
            
            <div class="denoise-controls">
                <label class="checkbox-container">
                    <input type="checkbox" id="enableDenoise">
                    啟用頻域背景雜訊濾除 (Spectral Subtraction Noise Reduction)
                </label>
                <span style="color: var(--text-muted); font-size: 0.85rem;">- 透過 IFFT 動態重構純淨音檔 (需要載入背景噪音檔案)</span>
            </div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button id="processBtn" onclick="processData()">1. Initialize Time-Domain Sync</button>
                <button id="analyzeBtn" onclick="runAdvancedAnalysis()" disabled style="background-color: var(--fft-color);">2. Execute STFT & Kinematic Order Tracking</button>
            </div>
            
            <div class="playback-controls">
                <span style="color: #fff; font-weight: bold;">Analysis Window & Playback:</span>
                <div class="param-item"><label>Start (s)</label><input type="number" id="playStart" value="0.00" step="0.5" min="0" onchange="updateTimeHighlight()"></div>
                <div class="param-item"><label>End (s)</label><input type="number" id="playEnd" value="0.00" step="0.5" min="0" onchange="updateTimeHighlight()"></div>
                <button id="playBtn" onclick="playTargetAudio()" disabled style="background-color: #1f6feb; width: auto; margin-bottom: 0;">▶ Play Range</button>
                <button id="stopBtn" onclick="stopAudio()" disabled style="background-color: #da3633; width: auto; margin-bottom: 0;">■ Stop</button>
                <div style="flex-grow: 1;"></div>
                <div class="time-display">T: <span id="currentTimeDisplay">0.00</span> s</div>
            </div>
            
            <div id="statusMsg" class="status">System Standby. Awaiting data insertion.</div>
        </div>

        <div class="panel"><div id="plotTime" class="plot-container"></div></div>
        <div class="panel"><div id="plotPSD" class="plot-container"></div></div>

        <div class="grid-2">
            <div class="panel"><div id="plotSpectrogram" class="plot-container"></div></div>
            <div class="panel"><div id="plotOrder" class="plot-container"></div></div>
        </div>
    </div>

    <script>
        const FS = 2000; 
        let globalTargetAudio = null;
        let globalCanData = null;
        let globalAudioDuration = 0;

        document.querySelectorAll('.kinematic-params input').forEach(input => {
            input.addEventListener('input', () => {
                const tm = parseFloat(document.getElementById('tMotor').value);
                const to = parseFloat(document.getElementById('tOut').value);
                const tfp = parseFloat(document.getElementById('tFrontPulley').value);
                document.getElementById('calcBeltOrder').innerText = (tfp * (tm / to)).toFixed(2);
                document.getElementById('calcGearOrder').innerText = tm.toFixed(2);
            });
        });

        function customFFT(real, imag) {
            let n = real.length;
            if (n <= 1) return;
            let j = 0;
            for (let i = 0; i < n - 1; i++) {
                if (i < j) {
                    let tReal = real[i], tImag = imag[i];
                    real[i] = real[j]; imag[i] = imag[j];
                    real[j] = tReal; imag[j] = tImag;
                }
                let k = n >> 1;
                while (k <= j) { j -= k; k >>= 1; }
                j += k;
            }
            for (let size = 2; size <= n; size <<= 1) {
                let halfSize = size >> 1;
                let theta = -2 * Math.PI / size;
                let wpReal = Math.cos(theta), wpImag = Math.sin(theta);
                for (let i = 0; i < n; i += size) {
                    let wReal = 1, wImag = 0;
                    for (let j = 0; j < halfSize; j++) {
                        let uReal = real[i + j], uImag = imag[i + j];
                        let tReal = wReal * real[i + j + halfSize] - wImag * imag[i + j + halfSize];
                        let tImag = wReal * imag[i + j + halfSize] + wImag * real[i + j + halfSize];
                        real[i + j] = uReal + tReal;
                        imag[i + j] = uImag + tImag;
                        real[i + j + halfSize] = uReal - tReal;
                        imag[i + j + halfSize] = uImag - tImag;
                        let nextWReal = wReal * wpReal - wImag * wpImag;
                        wImag = wReal * wpImag + wImag * wpReal;
                        wReal = nextWReal;
                    }
                }
            }
        }

        function customIFFT(real, imag) {
            let n = real.length;
            for (let i = 0; i < n; i++) imag[i] = -imag[i];
            customFFT(real, imag);
            for (let i = 0; i < n; i++) {
                real[i] /= n;
                imag[i] = -imag[i] / n;
            }
        }

        function applySpectralSubtraction(targetData, bgData, nfft = 1024, overlap = 512) {
            const step = nfft - overlap;
            const bgProfile = new Float32Array(nfft);
            let bgWindowsCount = 0;
            const windowFunc = new Float32Array(nfft);
            for(let i=0; i<nfft; i++) windowFunc[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / nfft));

            for (let w = 0; w < Math.floor((bgData.length - nfft) / step); w++) {
                let start = w * step;
                let real = new Float32Array(nfft);
                let imag = new Float32Array(nfft);
                for (let i = 0; i < nfft; i++) real[i] = bgData[start + i] * windowFunc[i];
                customFFT(real, imag);
                for (let i = 0; i < nfft; i++) bgProfile[i] += Math.sqrt(real[i]*real[i] + imag[i]*imag[i]);
                bgWindowsCount++;
            }
            if(bgWindowsCount > 0) {
                for(let i=0; i<nfft; i++) bgProfile[i] /= bgWindowsCount;
            }

            const outData = new Float32Array(targetData.length);
            const targetWindowsCount = Math.floor((targetData.length - nfft) / step);
            const alpha = 2.0; 
            const beta = 0.05; 

            for (let w = 0; w <= targetWindowsCount; w++) {
                let start = w * step;
                let real = new Float32Array(nfft);
                let imag = new Float32Array(nfft);
                
                for (let i = 0; i < nfft; i++) {
                    if (start + i < targetData.length) real[i] = targetData[start + i] * windowFunc[i];
                }
                
                customFFT(real, imag);

                for (let i = 0; i < nfft; i++) {
                    let mag = Math.sqrt(real[i]*real[i] + imag[i]*imag[i]);
                    let phase = Math.atan2(imag[i], real[i]);
                    let newMag = Math.max(mag - (alpha * bgProfile[i]), mag * beta);
                    real[i] = newMag * Math.cos(phase);
                    imag[i] = newMag * Math.sin(phase);
                }

                customIFFT(real, imag);

                for (let i = 0; i < nfft; i++) {
                    if (start + i < outData.length) outData[start + i] += real[i]; 
                }
            }
            return Array.from(outData);
        }

        function computeSTFT(data, fs, nfft = 1024, overlap = 512) {
            const step = nfft - overlap;
            const numWindows = Math.floor((data.length - nfft) / step) + 1;
            const freqs = Array.from({length: nfft/2}, (_, i) => i * fs / nfft);
            const times = [];
            const Sxx = []; 
            const avgPSD = new Float32Array(nfft/2);

            for(let i=0; i<nfft/2; i++) Sxx.push(new Float32Array(numWindows));

            const window = new Float32Array(nfft);
            let winSum = 0;
            for(let i=0; i<nfft; i++) {
                window[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / nfft));
                winSum += window[i] * window[i];
            }
            const scale = 2.0 / (fs * winSum);

            for (let w = 0; w < numWindows; w++) {
                const start = w * step;
                times.push((start + nfft/2) / fs);
                const real = new Float32Array(nfft);
                const imag = new Float32Array(nfft);
                
                for (let i = 0; i < nfft; i++) {
                    if(start+i < data.length) real[i] = data[start + i] * window[i];
                }
                
                customFFT(real, imag);
                for (let i = 0; i < nfft/2; i++) {
                    let power = (real[i]*real[i] + imag[i]*imag[i]) * scale;
                    Sxx[i][w] = 10 * Math.log10(power + 1e-12);
                    avgPSD[i] += power;
                }
            }
            for(let i=0; i<nfft/2; i++) avgPSD[i] = 10 * Math.log10((avgPSD[i] / numWindows) + 1e-12);
            return { times, freqs, Sxx, avgPSD };
        }

        function interpolate(xArr, yArr, xTarget) {
            if (!xArr || xArr.length === 0) return 0;
            let l = 0, r = xArr.length - 1;
            if (xTarget <= xArr[0]) return yArr[0];
            if (xTarget >= xArr[r]) return yArr[r];
            while (l <= r) {
                let m = (l + r) >> 1;
                if (xArr[m] < xTarget) l = m + 1;
                else r = m - 1;
            }
            let x0 = xArr[l-1], x1 = xArr[l];
            return yArr[l-1] + (yArr[l] - yArr[l-1]) * (xTarget - x0) / (x1 - x0);
        }

        function computeOrderSpectrogram(stftRes, canData) {
            const maxOrder = 30;
            const orderRes = 0.1; 
            const numOrderBins = Math.floor(maxOrder / orderRes) + 1;
            const orders = Array.from({length: numOrderBins}, (_, i) => i * orderRes);
            const times = stftRes.times;
            const Oxx = [];
            for(let i=0; i<numOrderBins; i++) Oxx.push(new Float32Array(times.length).fill(-120));

            for (let tIdx = 0; tIdx < times.length; tIdx++) {
                let rpm = interpolate(canData.time, canData.rpm, times[tIdx]);
                if (Math.abs(rpm) < 100) continue; 
                let baseFreq = Math.abs(rpm) / 60.0;

                for (let fIdx = 0; fIdx < stftRes.freqs.length; fIdx++) {
                    let order = stftRes.freqs[fIdx] / baseFreq;
                    if (order <= maxOrder) {
                        let oIdx = Math.round(order / orderRes);
                        if (oIdx < numOrderBins && stftRes.Sxx[fIdx][tIdx] > Oxx[oIdx][tIdx]) {
                            Oxx[oIdx][tIdx] = stftRes.Sxx[fIdx][tIdx];
                        }
                    }
                }
            }
            return { orders, times, Oxx };
        }

        function timeStrToMs(timeStr) {
            const match = timeStr.match(/(\d{1,2}):(\d{2}):(\d{2})\.(\d{3})/);
            if (!match) return 0;
            return parseInt(match[1]) * 3600000 + parseInt(match[2]) * 60000 + parseInt(match[3]) * 1000 + parseInt(match[4]);
        }

        async function parseAudioCSV(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const lines = e.target.result.trim().split('\n');
                    const data = []; let sum = 0; let startTimeMs = null;
                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(',');
                        if (cols.length >= 3) {
                            if (startTimeMs === null && cols[0]) startTimeMs = timeStrToMs(cols[0]);
                            const val = parseFloat(cols[2]);
                            if (!isNaN(val)) { data.push(val); sum += val; }
                        }
                    }
                    const mean = sum / data.length;
                    resolve({ data: data.map(val => val - mean), startMs: startTimeMs });
                };
                reader.readAsText(file);
            });
        }

        async function parseCANTRC(file, audioStartMs) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const lines = e.target.result.split('\n');
                    const timeData = []; const rpmData = []; let trcBaseMs = null;
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (line.startsWith(';') && line.includes('Start time:')) {
                            const match = line.match(/(\d{1,2}:\d{2}:\d{2}\.\d{3})/);
                            if (match) trcBaseMs = timeStrToMs(match[1]);
                            continue;
                        }
                        if (line.startsWith(';') || line === '') continue;
                        const parts = line.split(/\s+/);
                        if (parts.length >= 13 && parts[3] === '0040' && parts[2] === 'Rx') {
                            const rpm = ((parseInt(parts[12], 16) << 8) | parseInt(parts[11], 16)) - 10000;
                            if (trcBaseMs !== null && audioStartMs !== null) {
                                timeData.push((trcBaseMs + parseFloat(parts[1]) - audioStartMs) / 1000.0);
                                rpmData.push(rpm);
                            }
                        }
                    }
                    resolve({ time: timeData, rpm: rpmData });
                };
                reader.readAsText(file);
            });
        }

        function updateTimeHighlight() {
            if (!globalTargetAudio) return;
            let startSec = parseFloat(document.getElementById('playStart').value);
            let endSec = parseFloat(document.getElementById('playEnd').value);
            if (isNaN(startSec) || isNaN(endSec) || startSec >= endSec) return;

            // 在 Time Domain 圖表上加上黃色高亮區域，標示目前選擇的分析與播放區間
            Plotly.relayout('plotTime', {
                shapes: [{
                    type: 'rect', xref: 'x', yref: 'paper',
                    x0: startSec, x1: endSec, y0: 0, y1: 1,
                    fillcolor: 'rgba(255, 255, 0, 0.15)', line: { width: 1, color: 'rgba(255, 255, 0, 0.5)' }
                }]
            });
        }

        async function processData() {
            const fileBg = document.getElementById('fileBg').files[0];
            const fileSlide = document.getElementById('fileSlide').files[0];
            const fileCAN = document.getElementById('fileCAN').files[0];
            const enableDenoise = document.getElementById('enableDenoise').checked;
            const statusMsg = document.getElementById('statusMsg');

            if (!fileSlide) { statusMsg.style.color = "#f85149"; statusMsg.innerText = "Error: Target Audio required."; return; }
            if (enableDenoise && !fileBg) { alert("啟動濾除雜訊必須上傳背景噪音 CSV 檔案。"); return; }
            
            statusMsg.style.color = "#d29922"; 
            statusMsg.innerText = enableDenoise ? "Applying Spectral Subtraction to filter noise..." : "Processing Time-Domain Sync...";
            
            try {
                const targetRes = await parseAudioCSV(fileSlide);
                let processingData = targetRes.data;

                if (enableDenoise) {
                    const bgRes = await parseAudioCSV(fileBg);
                    processingData = applySpectralSubtraction(targetRes.data, bgRes.data);
                }

                globalTargetAudio = processingData;
                
                globalAudioDuration = globalTargetAudio.length / FS;
                document.getElementById('playStart').value = "0.00";
                document.getElementById('playEnd').value = globalAudioDuration.toFixed(2);
                document.getElementById('playEnd').max = globalAudioDuration.toFixed(2);

                const timeSlide = globalTargetAudio.map((_, i) => i / FS);
                const traceName = enableDenoise ? 'Audio (Denoised)' : 'Audio (Raw)';
                const traces = [{ x: timeSlide, y: globalTargetAudio, mode: 'lines', type: 'scattergl', name: traceName, line: {color: enableDenoise ? '#a371f7' : '#58a6ff', width: 1}, yaxis: 'y1' }];

                if (fileCAN) {
                    globalCanData = await parseCANTRC(fileCAN, targetRes.startMs);
                    const maxTime = timeSlide[timeSlide.length - 1];
                    const ft = [], fr = [];
                    for(let i=0; i<globalCanData.time.length; i++) {
                        if (globalCanData.time[i] >= 0 && globalCanData.time[i] <= maxTime) {
                            ft.push(globalCanData.time[i]); fr.push(globalCanData.rpm[i]);
                        }
                    }
                    traces.push({ x: ft, y: fr, mode: 'lines', type: 'scattergl', name: 'Motor RPM', line: {color: 'var(--rpm-color)', width: 2}, yaxis: 'y2' });
                }

                Plotly.newPlot('plotTime', traces, {
                    title: { text: 'Time Domain & RPM Sync', font: { color: '#c9d1d9' } },
                    plot_bgcolor: '#0d1117', paper_bgcolor: '#161b22', font: {color: '#8b949e'},
                    xaxis: { title: 'Time (s)', gridcolor: '#30363d' },
                    yaxis: { title: 'Amplitude', gridcolor: '#30363d' },
                    yaxis2: { title: 'RPM', overlaying: 'y', side: 'right', showgrid: false },
                    margin: { t: 40, l: 50, r: 50, b: 40 }, legend: { x: 0, y: 1.1, orientation: 'h' }
                }, { responsive: true });
                
                updateTimeHighlight();
                
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('playBtn').disabled = false;
                
                let successMsg = `Time Sync Complete. Audio length: ${globalAudioDuration.toFixed(2)}s. Ready for Analysis.`;
                if(enableDenoise) successMsg = `Noise filtered. Audio length: ${globalAudioDuration.toFixed(2)}s. Ready for Analysis.`;
                statusMsg.style.color = "#2ea043"; statusMsg.innerText = successMsg;

            } catch (err) { statusMsg.style.color = "#f85149"; statusMsg.innerText = "Error: " + err.message; }
        }

        let audioCtx = null;
        let audioSource = null;
        let animationFrameId = null;
        let playbackStartTimeCtx = 0;
        let playbackStartOffset = 0;

        function updateTimeDisplay() {
            if (audioCtx && audioCtx.state === 'running') {
                const currentElapsed = audioCtx.currentTime - playbackStartTimeCtx;
                const actualPlayTime = playbackStartOffset + currentElapsed;
                document.getElementById('currentTimeDisplay').innerText = actualPlayTime.toFixed(2);
                animationFrameId = requestAnimationFrame(updateTimeDisplay);
            }
        }

        function playTargetAudio() {
            if (!globalTargetAudio) return;
            const statusMsg = document.getElementById('statusMsg');
            
            let startSec = parseFloat(document.getElementById('playStart').value);
            let endSec = parseFloat(document.getElementById('playEnd').value);
            
            if (isNaN(startSec) || startSec < 0) startSec = 0;
            if (isNaN(endSec) || endSec > globalAudioDuration) endSec = globalAudioDuration;
            if (startSec >= endSec) {
                statusMsg.style.color = "#f85149";
                statusMsg.innerText = "Invalid Playback Range. Check Start/End time.";
                return;
            }
            
            const durationSec = endSec - startSec;

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (audioCtx && audioCtx.state !== 'closed') { audioCtx.close(); }
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const targetFs = audioCtx.sampleRate;
            const ratio = targetFs / FS; 
            const outLen = Math.floor(globalTargetAudio.length * ratio);
            
            const buffer = audioCtx.createBuffer(1, outLen, targetFs);
            const channelData = buffer.getChannelData(0);
            
            let maxVal = 0;
            for (let i = 0; i < globalTargetAudio.length; i++) {
                if (Math.abs(globalTargetAudio[i]) > maxVal) maxVal = Math.abs(globalTargetAudio[i]);
            }
            if (maxVal === 0) maxVal = 1;
            
            for (let i = 0; i < outLen; i++) {
                const origIndex = i / ratio;
                const idx0 = Math.floor(origIndex);
                const idx1 = Math.min(idx0 + 1, globalTargetAudio.length - 1);
                const frac = origIndex - idx0;
                const v0 = globalTargetAudio[idx0] / maxVal;
                const v1 = globalTargetAudio[idx1] / maxVal;
                channelData[i] = v0 + (v1 - v0) * frac;
            }
            
            audioSource = audioCtx.createBufferSource();
            audioSource.buffer = buffer;
            audioSource.connect(audioCtx.destination);
            
            audioSource.start(0, startSec, durationSec);
            
            playbackStartOffset = startSec;
            playbackStartTimeCtx = audioCtx.currentTime;
            updateTimeDisplay();
            
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('playBtn').disabled = true;
            statusMsg.style.color = "#00ffcc";
            statusMsg.innerText = `Playing Section: ${startSec.toFixed(2)}s to ${endSec.toFixed(2)}s...`;
            
            audioSource.onended = () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('playBtn').disabled = false;
                statusMsg.style.color = "#2ea043";
                statusMsg.innerText = "Audio Playback: Finished.";
                if (audioCtx && audioCtx.state !== 'closed') { audioCtx.close(); }
                audioCtx = null;
            };
        }

        function stopAudio() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (audioSource) {
                audioSource.stop();
                audioSource.disconnect();
                audioSource = null;
            }
            if (audioCtx && audioCtx.state !== 'closed') { audioCtx.close(); }
            audioCtx = null;
            
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('playBtn').disabled = false;
            
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.style.color = "#2ea043";
            statusMsg.innerText = "Audio Playback: Interrupted.";
        }

        async function runAdvancedAnalysis() {
            const statusMsg = document.getElementById('statusMsg');
            const btn = document.getElementById('analyzeBtn');
            if (!globalTargetAudio) return;

            // 取得分析區間設定
            let startSec = parseFloat(document.getElementById('playStart').value);
            let endSec = parseFloat(document.getElementById('playEnd').value);
            
            if (isNaN(startSec) || startSec < 0) startSec = 0;
            if (isNaN(endSec) || endSec > globalAudioDuration) endSec = globalAudioDuration;
            if (startSec >= endSec) {
                statusMsg.style.color = "#f85149";
                statusMsg.innerText = "Error: Invalid Analysis Range.";
                return;
            }

            // 裁切資料陣列
            let startIdx = Math.floor(startSec * FS);
            let endIdx = Math.floor(endSec * FS);
            let slicedAudio = globalTargetAudio.slice(startIdx, endIdx);

            // FFT 需要足夠的點數 (1024 點在 2kHz 下約需 0.512 秒)
            if (slicedAudio.length < 1024) {
                statusMsg.style.color = "#f85149";
                statusMsg.innerText = "Error: Analysis window too short. Requires at least 0.6 seconds.";
                return;
            }

            btn.disabled = true;
            statusMsg.style.color = "#d29922"; 
            statusMsg.innerText = `Executing FFT on window [${startSec}s - ${endSec}s]...`;

            setTimeout(() => {
                try {
                    // 只針對切割後的音訊進行頻譜運算
                    const stft = computeSTFT(slicedAudio, FS, 1024, 512);

                    // 重要：將 STFT 的相對時間補償回絕對時間，讓 Spectrogram 與 CAN RPM 能正確對齊
                    stft.times = stft.times.map(t => t + startSec);

                    Plotly.newPlot('plotPSD', [{
                        x: stft.freqs, y: stft.avgPSD, type: 'scatter', mode: 'lines',
                        line: {color: 'var(--fft-color)'}, fill: 'tozeroy', fillcolor: 'rgba(163, 113, 247, 0.2)'
                    }], {
                        title: { text: `Power Spectral Density (Window: ${startSec}s - ${endSec}s)`, font: { color: '#c9d1d9' } },
                        plot_bgcolor: '#0d1117', paper_bgcolor: '#161b22', font: {color: '#8b949e'},
                        xaxis: { title: 'Frequency (Hz)', gridcolor: '#30363d' },
                        yaxis: { title: 'Magnitude (dB)', gridcolor: '#30363d' },
                        margin: { t: 40, l: 50, r: 20, b: 40 }
                    });

                    const tm = parseFloat(document.getElementById('tMotor').value);
                    const to = parseFloat(document.getElementById('tOut').value);
                    const tfp = parseFloat(document.getElementById('tFrontPulley').value);
                    const beltOrder = tfp * (tm / to);
                    const gearOrder = tm;

                    const specTraces = [{
                        z: stft.Sxx, x: stft.times, y: stft.freqs, type: 'heatmap',
                        colorscale: 'Jet', zmin: Math.max(...stft.Sxx[0]) - 55 
                    }];
                    
                    if (globalCanData) {
                        const canFreqs = globalCanData.rpm.map(r => Math.abs(r)/60);
                        specTraces.push({
                            x: globalCanData.time, y: canFreqs, type: 'scatter', mode: 'lines',
                            name: 'Motor Base Freq (1X)', line: {color: '#ffffff', dash: 'dot', width: 2}
                        });
                    }
                    
                    Plotly.newPlot('plotSpectrogram', specTraces, {
                        title: { text: `Spectrogram (${startSec}s - ${endSec}s)`, font: { color: '#c9d1d9' } },
                        plot_bgcolor: '#0d1117', paper_bgcolor: '#161b22', font: {color: '#8b949e'},
                        xaxis: { title: 'Time (s)', gridcolor: '#30363d', range: [startSec, endSec] }, // 鎖定 X 軸範圍
                        yaxis: { title: 'Frequency (Hz)', gridcolor: '#30363d' },
                        margin: { t: 40, l: 50, r: 20, b: 40 }
                    });

                    if (globalCanData) {
                        const orderRes = computeOrderSpectrogram(stft, globalCanData);
                        
                        const shapes = [
                            { type: 'line', x0: 0, x1: 1, xref: 'paper', y0: beltOrder, y1: beltOrder, line: { color: 'var(--kinematic-belt)', width: 2, dash: 'dash' } },
                            { type: 'line', x0: 0, x1: 1, xref: 'paper', y0: gearOrder, y1: gearOrder, line: { color: 'var(--kinematic-gear)', width: 2, dash: 'dash' } },
                            { type: 'line', x0: 0, x1: 1, xref: 'paper', y0: 1.0, y1: 1.0, line: { color: '#ffffff', width: 1, dash: 'dot' } }
                        ];

                        const annotations = [
                            { x: 0.98, y: beltOrder + 1, xref: 'paper', yref: 'y', text: `Belt Mesh (${beltOrder.toFixed(2)}x)`, showarrow: false, font: { color: 'var(--kinematic-belt)' }, xanchor: 'right' },
                            { x: 0.98, y: gearOrder + 1, xref: 'paper', yref: 'y', text: `Gear Mesh (${gearOrder.toFixed(2)}x)`, showarrow: false, font: { color: 'var(--kinematic-gear)' }, xanchor: 'right' },
                            { x: 0.98, y: 1.5, xref: 'paper', yref: 'y', text: `Motor Rotor (1x)`, showarrow: false, font: { color: '#ffffff' }, xanchor: 'right' }
                        ];

                        Plotly.newPlot('plotOrder', [{
                            z: orderRes.Oxx, x: orderRes.times, y: orderRes.orders, type: 'heatmap',
                            colorscale: 'Jet', zmin: Math.max(...orderRes.Oxx[0]) - 50
                        }], {
                            title: { text: 'Order Tracking (Powertrain Overlays)', font: { color: '#c9d1d9' } },
                            plot_bgcolor: '#0d1117', paper_bgcolor: '#161b22', font: {color: '#8b949e'},
                            xaxis: { title: 'Time (s)', gridcolor: '#30363d', range: [startSec, endSec] }, // 鎖定 X 軸範圍
                            yaxis: { title: 'Order (Multiples of Motor RPM)', gridcolor: '#30363d', range: [0, 30] },
                            margin: { t: 40, l: 50, r: 20, b: 40 },
                            shapes: shapes,
                            annotations: annotations
                        });
                    }
                    statusMsg.style.color = "#2ea043"; statusMsg.innerText = `Kinematic Analysis Complete for [${startSec}s - ${endSec}s].`;
                } catch (err) { statusMsg.style.color = "#f85149"; statusMsg.innerText = "Error: " + err.message; }
                finally { btn.disabled = false; }
            }, 100);
        }
    </script>
