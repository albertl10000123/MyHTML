<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gogoro 8-bit 車載視覺模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; }
        .dashboard-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 900 / 424; 
            margin: 0 auto;
            background-color: #000;
            overflow: visible; 
            border: 1px solid #111;
        }
        .dashboard-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('1RB外框.png'); /* 使用遮罩圖 */
            background-size: 100% 100%;
            pointer-events: none;
            z-index: 20; 
            mix-blend-mode: multiply; /* 黑色不透光，透明/白色處透光 */
        }
        #svgOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10; 
        }
        .panel { background: rgba(20, 20, 20, 0.95); border: 1px solid #333; border-radius: 12px; padding: 20px; }
        input[type=range] { accent-color: #06b6d4; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col gap-6">

    <div class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側控制面板 -->
        <div class="panel lg:col-span-1 flex flex-col gap-6">
            <div>
                <h1 class="text-2xl font-bold text-cyan-400 mb-2">Ambilight 模擬器</h1>
                <p class="text-gray-400 text-sm mb-4">環境色彩感知與 CAN Bus 映射</p>
                
                <label class="block w-full border-2 border-dashed border-gray-600 hover:border-cyan-400 p-6 rounded-lg text-center cursor-pointer transition-colors">
                    <span class="text-gray-300">上傳環境測試圖片</span>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden">
                </label>
            </div>

            <div>
                <h3 class="text-lg font-semibold mb-3">色彩擷取參數</h3>
                
                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-1">全局亮度增益 (Value Boost)</label>
                    <input type="range" id="brightnessSlider" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full">
                </div>

                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-1">演算法選擇</label>
                    <select id="algoSelect" class="w-full bg-gray-900 text-white border border-gray-700 rounded p-2 outline-none focus:border-cyan-500">
                        <option value="polar">極座標射線投影法 (Polar Ray)</option>
                        <option value="edge">邊緣區塊平均法 (Edge Block Avg)</option>
                        <option value="kmeans" selected>K-Means 主色萃取法 (K-Means)</option>
                    </select>
                </div>

                <div id="dynamicParams" class="space-y-4 bg-gray-900 p-4 rounded-lg border border-gray-800 shadow-inner">
                    <!-- 動態參數區 -->
                </div>
                
                <div id="algoDesc" class="mt-4 p-3 bg-gray-800/80 rounded-lg text-xs text-gray-300 border border-gray-700 leading-relaxed shadow-inner">
                    <!-- 動態說明文字區 -->
                </div>
            </div>
            
            <div class="mt-auto relative">
                <canvas id="sourceCanvas" class="w-full rounded bg-black border border-gray-800 shadow"></canvas>
                <div class="absolute top-2 left-2 bg-black/60 text-[10px] text-cyan-400 px-2 py-1 rounded">雷達採樣點追蹤</div>
            </div>
        </div>

        <!-- 右側預覽與 CAN Payload 輸出 -->
        <div class="panel lg:col-span-2 flex flex-col">
            <h2 class="text-xl font-bold mb-4">實體導光條漸層即時預覽 (遮罩流裁切版)</h2>
            
            <div class="dashboard-container mb-6" id="dashboard">
                <div class="dashboard-bg"></div>
                
                <!-- HUD 戰情板 (包含 H/S/V) -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-30">
                    <div class="bg-black/85 p-3 rounded-lg border border-cyan-500/40 text-[10px] text-cyan-300 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-x-2 gap-y-1 backdrop-blur-md shadow-2xl" id="hvGrid">
                        <div class="col-span-full text-center text-gray-500 mb-1">等待影像解析...</div>
                    </div>
                </div>
                
                <!-- SVG 光條渲染區 -->
                <svg id="svgOverlay" viewBox="0 0 900 424" preserveAspectRatio="none"></svg>
            </div>

            <!-- CAN Payload 輸出區 (包含 V1 與 V2 3-Byte 擴增版) -->
            <div class="bg-black/50 p-4 rounded-lg border border-gray-800 flex-grow flex flex-col gap-3">
                <!-- V1 Standard 2-Byte Payload -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="text-cyan-400 font-bold font-mono text-xs">PCAN TX Payload V1 Standard (0x0AA - 2 Bytes/LED, Len: 0x2C)</h3>
                        <button id="copyBtnV1" class="bg-cyan-800 hover:bg-cyan-700 text-white text-[10px] py-1 px-3 rounded cursor-pointer transition-colors active:scale-95">複製 V1 Payload</button>
                    </div>
                    <textarea id="dataOutput" class="w-full h-12 bg-[#0a0a0a] text-[#0f0] font-mono text-xs p-2 rounded border border-gray-800 resize-none outline-none" readonly>等待影像載入後產生...</textarea>
                </div>

                <!-- V2 Expanded 3-Byte Payload (支援 Saturation) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="text-purple-400 font-bold font-mono text-xs">PCAN TX Payload V2 Expanded (0x0AA - 3 Bytes/LED, Len: 0x40, 支援飽和度)</h3>
                        <button id="copyBtnV2" class="bg-purple-700 hover:bg-purple-600 text-white text-[10px] py-1 px-3 rounded cursor-pointer transition-colors active:scale-95">複製 V2 Payload</button>
                    </div>
                    <textarea id="dataOutputV2" class="w-full h-16 bg-[#0a0a0a] text-[#0f0] font-mono text-xs p-2 rounded border border-gray-800 resize-none outline-none" readonly>等待影像載入後產生...</textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const sourceCanvas = document.getElementById('sourceCanvas');
        const ctx = sourceCanvas.getContext('2d', { willReadFrequently: true });
        const brightnessSlider = document.getElementById('brightnessSlider');
        const algoSelect = document.getElementById('algoSelect');
        const dynamicParams = document.getElementById('dynamicParams');
        
        let currentImage = null; // 儲存原始圖片物件
        let segmentElements = {}; 

        // 完美吻合 1RB外框.png 開孔的 10 區塊幾何路徑 (使用 SVG 絕對座標)
        const SEGMENTS = [
            // 上方 1 條 (由 I1 漸層到 I2)
            { id: 'I1_I2', nodes: ['I1', 'I2'], d: 'M 250 45 L 650 45' }, 
            
            // 右方 3 條 (順時針)
            { id: 'I3_I4', nodes: ['I3', 'I4'], d: 'M 670 45 Q 850 45 850 140' }, 
            { id: 'I5_I6', nodes: ['I5', 'I6'], d: 'M 855 160 L 855 264' },
            { id: 'I7_I8', nodes: ['I7', 'I8'], d: 'M 850 284 Q 850 379 670 379' },
            
            // 下方 3 條 (由右至左)
            { id: 'J1_J2', nodes: ['J1', 'J2'], d: 'M 650 379 L 520 379' }, 
            { id: 'J3_J4', nodes: ['J3', 'J4'], d: 'M 500 379 L 400 379' }, 
            { id: 'J5_J6', nodes: ['J5', 'J6'], d: 'M 380 379 L 250 379' }, 
            
            // 左方 3 條 (由下至上)
            { id: 'J7_J8', nodes: ['J7', 'J8'], d: 'M 230 379 Q 50 379 50 284' }, 
            { id: 'K1_K2', nodes: ['K1', 'K2'], d: 'M 45 264 L 45 160' }, 
            { id: 'K3_K4', nodes: ['K3', 'K4'], d: 'M 50 140 Q 50 45 230 45' }  
        ];

        const LED_SAMPLING_ANGLES = [
            { id: 'I1', angle: 0 }, { id: 'I2', angle: 337.5 }, { id: 'I3', angle: 315 },
            { id: 'I4', angle: 292.5 }, { id: 'I5', angle: 270 }, { id: 'I6', angle: 247.5 },
            { id: 'I7', angle: 225 }, { id: 'I8', angle: 202.5 }, { id: 'J1', angle: 180 },
            { id: 'J2', angle: 168.75 }, { id: 'J3', angle: 157.5 }, { id: 'J4', angle: 146.25 },
            { id: 'J5', angle: 135 }, { id: 'J6', angle: 123.75 }, { id: 'J7', angle: 112.5 },
            { id: 'J8', angle: 101.25 }, { id: 'K1', angle: 90 }, { id: 'K2', angle: 67.5 },
            { id: 'K3', angle: 45 }, { id: 'K4', angle: 22.5 }
        ];

        const ALGO_DESCRIPTIONS = {
            polar: "<strong class='text-cyan-400'>極座標射線投影法 (Polar Ray)</strong><br>從影像中心發射 20 條射線擷取指定半徑像素。精確映射方位，適合捕捉主體色彩。",
            edge: "<strong class='text-cyan-400'>邊緣區塊平均法 (Edge Block Avg)</strong><br>將外圍劃分為 20 個扇形區塊計算平均色。變化柔和均勻，但遇複雜背景易產生灰色調。",
            kmeans: "<strong class='text-cyan-400'>K-Means 主色萃取法 (K-Means)</strong><br>利用 AI 分群演算法，自動從各區塊排除雜色，萃取出「飽和度x亮度最高」的主色。對比視覺衝擊力最佳！"
        };

        const PARAMS = { radius: 85, margin: 20, kvalue: 3 };

        function buildParamUI() {
            const algo = algoSelect.value;
            dynamicParams.innerHTML = '';
            document.getElementById('algoDesc').innerHTML = ALGO_DESCRIPTIONS[algo];
            
            const createSlider = (id, label, min, max, step, value, onChange) => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = `<label class="flex justify-between text-sm text-gray-400 mb-1"><span>${label}</span><span id="${id}Val">${value}</span></label>
                                     <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" class="w-full">`;
                dynamicParams.appendChild(wrapper);
                const slider = wrapper.querySelector(`#${id}`);
                slider.addEventListener('input', (e) => {
                    wrapper.querySelector(`#${id}Val`).innerText = e.target.value;
                    onChange(e.target.value);
                });
            };

            if (algo === 'polar') {
                createSlider('radiusSlider', '射線採樣半徑 (%)', 10, 100, 1, PARAMS.radius, (v) => { PARAMS.radius = v; processImageColors(); });
            } else {
                createSlider('marginSlider', '邊緣厚度 (Margin %)', 5, 50, 1, PARAMS.margin, (v) => { PARAMS.margin = v; processImageColors(); });
                if (algo === 'kmeans') {
                    createSlider('kvalueSlider', '叢集萃取數量 (K)', 2, 5, 1, PARAMS.kvalue, (v) => { PARAMS.kvalue = parseInt(v); processImageColors(); });
                }
            }
        }

        function initSvgSegments() {
            const svg = document.getElementById('svgOverlay');
            svg.innerHTML = '';
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            svg.appendChild(defs);

            SEGMENTS.forEach((seg, index) => {
                const parts = seg.d.split(/[\s,]+/);
                const startX = parts[1];
                const startY = parts[2];
                const endX = parts[parts.length - 2];
                const endY = parts[parts.length - 1];

                const gradId = `grad_${index}`;
                const grad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
                grad.setAttribute("id", gradId);
                grad.setAttribute("gradientUnits", "userSpaceOnUse"); // 解決水平線無效的 Bug
                grad.setAttribute("x1", startX);
                grad.setAttribute("y1", startY);
                grad.setAttribute("x2", endX);
                grad.setAttribute("y2", endY);

                const stop1 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
                stop1.setAttribute("offset", "0%");
                stop1.setAttribute("stop-color", "#111"); 
                
                const stop2 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
                stop2.setAttribute("offset", "100%");
                stop2.setAttribute("stop-color", "#111");

                grad.appendChild(stop1);
                grad.appendChild(stop2);
                defs.appendChild(grad);

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", seg.d);
                path.setAttribute("stroke", `url(#${gradId})`);
                path.setAttribute("stroke-width", "40"); // 加寬填滿外框遮罩
                path.setAttribute("fill", "none");

                svg.appendChild(path);
                
                segmentElements[seg.nodes[0]] = stop1;
                segmentElements[seg.nodes[1]] = stop2;
            });
        }

        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let v = Math.max(r, g, b), c = v - Math.min(r, g, b);
            let h = c === 0 ? 0 : v === r ? (g - b) / c : v === g ? 2 + (b - r) / c : 4 + (r - g) / c;
            return { h: 60 * (h < 0 ? h + 6 : h), s: v === 0 ? 0 : c / v * 100, v: v * 100 };
        }

        // 轉換 HSV (0-360, 0-100, 0-100) 至 RGB (0-255, 0-255, 0-255)
        function hsvToRgb(h, s, v) {
            s /= 100; v /= 100;
            let c = v * s;
            let x = c * (1 - Math.abs((h / 60) % 2 - 1));
            let m = v - c;
            let r = 0, g = 0, b = 0;
            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h <= 360) { r = c; g = 0; b = x; }
            return {
                r: Math.round((r + m) * 255),
                g: Math.round((g + m) * 255),
                b: Math.round((b + m) * 255)
            };
        }

        function bucketEdgePixels(imageData) {
            const data = imageData.data, w = imageData.width, h = imageData.height;
            const cx = w / 2, cy = h / 2;
            const marginRatio = PARAMS.margin / 100;
            const innerRx = cx * (1 - marginRatio), innerRy = cy * (1 - marginRatio);
            let buckets = Array.from({length: 20}, () => []);

            for (let y = 0; y < h; y += 2) {
                for (let x = 0; x < w; x += 2) {
                    const dx = x - cx, dy = y - cy; 
                    
                    if ((dx*dx)/(innerRx*innerRx) + (dy*dy)/(innerRy*innerRy) > 1) {
                        let angle = Math.atan2(-dx, -dy) * 180 / Math.PI;
                        if (angle < 0) angle += 360;
                        
                        let minDiff = 360, bestIdx = 0;
                        LED_SAMPLING_ANGLES.forEach((node, idx) => {
                            let diff = Math.abs(node.angle - angle);
                            if (diff > 180) diff = 360 - diff;
                            if (diff < minDiff) { minDiff = diff; bestIdx = idx; }
                        });
                        
                        const idx = (y * w + x) * 4;
                        buckets[bestIdx].push({ r: data[idx], g: data[idx+1], b: data[idx+2], x: x, y: y });
                    }
                }
            }
            return buckets;
        }

        function processImageColors() {
            if (!currentImage) return;

            ctx.drawImage(currentImage, 0, 0, sourceCanvas.width, sourceCanvas.height);
            const imageData = ctx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
            
            const algo = algoSelect.value;
            let extractedColors = new Array(20).fill({r:0,g:0,b:0});
            let samplingPoints = []; 

            if (algo === 'polar') {
                const w = imageData.width, h = imageData.height, data = imageData.data;
                const cx = w / 2, cy = h / 2;
                const targetR = Math.min(cx, cy) * (PARAMS.radius / 100);

                LED_SAMPLING_ANGLES.forEach((node, idx) => {
                    const rad = node.angle * Math.PI / 180;
                    const px = Math.floor(cx - targetR * Math.sin(rad));
                    const py = Math.floor(cy - targetR * Math.cos(rad)); 
                    
                    if (px >= 0 && px < w && py >= 0 && py < h) {
                        const i = (py * w + px) * 4;
                        extractedColors[idx] = { r: data[i], g: data[i+1], b: data[i+2] };
                        samplingPoints.push({x: px, y: py, label: node.id});
                    }
                });
            } else {
                const buckets = bucketEdgePixels(imageData);
                if (algo === 'edge') {
                    buckets.forEach((b, idx) => {
                        if (b.length === 0) return;
                        let sum = b.reduce((acc, val) => { acc.r+=val.r; acc.g+=val.g; acc.b+=val.b; return acc; }, {r:0,g:0,b:0});
                        extractedColors[idx] = { r: sum.r/b.length, g: sum.g/b.length, b: sum.b/b.length };
                        if(b.length > 0) samplingPoints.push({x: b[Math.floor(b.length/2)].x, y: b[Math.floor(b.length/2)].y, label: LED_SAMPLING_ANGLES[idx].id});
                    });
                } else if (algo === 'kmeans') {
                    buckets.forEach((b, idx) => {
                        if (b.length === 0) return;
                        let samples = b.sort(() => 0.5 - Math.random()).slice(0, 300);
                        let bestScore = -1, bestColor = samples[0];
                        samples.forEach(c => {
                            const hsv = rgbToHsv(c.r, c.g, c.b);
                            const score = hsv.s * hsv.v;
                            if (score > bestScore) { bestScore = score; bestColor = c; }
                        });
                        extractedColors[idx] = bestColor;
                        samplingPoints.push({x: bestColor.x, y: bestColor.y, label: LED_SAMPLING_ANGLES[idx].id});
                    });
                }
            }

            drawSamplingCrosshairs(samplingPoints);
            renderSegmentsAndOutputCAN(extractedColors);
        }

        function drawSamplingCrosshairs(points) {
            ctx.fillStyle = '#0ff';
            ctx.font = '10px monospace';
            points.forEach(pt => {
                ctx.beginPath();
                ctx.moveTo(pt.x - 4, pt.y); ctx.lineTo(pt.x + 4, pt.y);
                ctx.moveTo(pt.x, pt.y - 4); ctx.lineTo(pt.x, pt.y + 4);
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillText(pt.label, pt.x + 5, pt.y + 5);
            });
        }

        function renderSegmentsAndOutputCAN(colorsArray) {
            const boost = parseFloat(brightnessSlider.value);
            let payloadData_V1 = [0xFE, 0x2C, 0x46]; // CAN Header V1 (44 Bytes)
            let payloadData_V2 = [0xFE, 0x40, 0x46]; // CAN Header V2 (64 Bytes)
            let hvHtml = '';

            LED_SAMPLING_ANGLES.forEach((node, index) => {
                const color = colorsArray[index];
                const hsv = rgbToHsv(color.r, color.g, color.b);
                let finalVal = Math.min(100, hsv.v * boost);
                let finalSat = Math.min(100, hsv.s);
                
                const stopElement = segmentElements[node.id];
                if (stopElement) {
                    // 使用精確的 hsvToRgb 轉換出真實的 CSS RGB 顏色
                    const rgb = hsvToRgb(hsv.h, finalSat, finalVal);
                    const cssColor = finalVal > 5 ? `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})` : '#111';
                    stopElement.setAttribute("stop-color", cssColor);
                }

                const hueInt = Math.floor(hsv.h);
                const valInt = Math.floor(finalVal);
                const satInt = Math.floor(finalSat);

                // --- V1 Standard 2-Byte Payload (0x2C = 44 Bytes) ---
                const v1_b0 = hueInt & 0xFF;
                const v1_b1 = (((hueInt >> 8) & 0x01) << 7) | (valInt & 0x7F);
                payloadData_V1.push(v1_b0, v1_b1);

                // --- V2 Expanded 3-Byte Payload (0x40 = 64 Bytes, 依據 image_b182f9.png 規範) ---
                // Byte 0: Hue[7:0]
                // Byte 1: Hue[8] (Bit 7) | Value[6:0] (Bit 6-0)
                // Byte 2: x (Bit 7 = 0) | Saturation[6:0] (Bit 6-0)
                const v2_b0 = hueInt & 0xFF;
                const v2_b1 = (((hueInt >> 8) & 0x01) << 7) | (valInt & 0x7F);
                const v2_b2 = satInt & 0x7F;
                payloadData_V2.push(v2_b0, v2_b1, v2_b2);

                // --- HUD 戰情板更新 (顯示 H, S, V) ---
                hvHtml += `<div class="flex justify-between items-center bg-gray-900/90 px-1 py-0.5 rounded border border-gray-700/50">
                            <span class="text-gray-400 font-bold w-4">${node.id}</span> 
                            <span class="font-mono text-[10px] flex gap-1">
                                <span><span class="text-purple-400">H</span>${hueInt.toString().padStart(3,'0')}</span>
                                <span><span class="text-blue-400">S</span>${satInt.toString().padStart(3,'0')}</span>
                                <span><span class="text-yellow-400">V</span>${valInt.toString().padStart(3,'0')}</span>
                            </span>
                           </div>`;
            });

            // 計算 V1 CRC 驗證碼: (-sum) & 0xFF
            let sum1 = 0;
            payloadData_V1.forEach(b => sum1 += b);
            const crc1 = (-sum1) & 0xFF;
            payloadData_V1.push(crc1);

            // 計算 V2 CRC 驗證碼: (-sum) & 0xFF
            let sum2 = 0;
            payloadData_V2.forEach(b => sum2 += b);
            const crc2 = (-sum2) & 0xFF;
            payloadData_V2.push(crc2);

            const hexStringV1 = payloadData_V1.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
            const hexStringV2 = payloadData_V2.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

            document.getElementById('dataOutput').value = hexStringV1;
            document.getElementById('dataOutputV2').value = hexStringV2;
            document.getElementById('hvGrid').innerHTML = hvHtml;
        }

        algoSelect.addEventListener('change', () => {
            buildParamUI();
            processImageColors();
        });

        brightnessSlider.addEventListener('input', () => {
            processImageColors();
        });

        document.getElementById('copyBtnV1').addEventListener('click', () => {
            const textArea = document.getElementById('dataOutput');
            if(!textArea.value || textArea.value.includes('等待')) return;
            textArea.select();
            document.execCommand('copy');
            const btn = document.getElementById('copyBtnV1');
            btn.innerText = '已複製 V1!';
            btn.classList.replace('bg-cyan-800', 'bg-green-600');
            setTimeout(() => {
                btn.innerText = '複製 V1 Payload';
                btn.classList.replace('bg-green-600', 'bg-cyan-800');
            }, 2000);
        });

        document.getElementById('copyBtnV2').addEventListener('click', () => {
            const textArea = document.getElementById('dataOutputV2');
            if(!textArea.value || textArea.value.includes('等待')) return;
            textArea.select();
            document.execCommand('copy');
            const btn = document.getElementById('copyBtnV2');
            btn.innerText = '已複製 V2!';
            btn.classList.replace('bg-purple-700', 'bg-green-600');
            setTimeout(() => {
                btn.innerText = '複製 V2 Payload';
                btn.classList.replace('bg-green-600', 'bg-purple-700');
            }, 2000);
        });

        imageUpload.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    currentImage = new Image();
                    currentImage.onload = () => {
                        const scale = Math.min(400 / currentImage.width, 300 / currentImage.height);
                        sourceCanvas.width = currentImage.width * scale;
                        sourceCanvas.height = currentImage.height * scale;
                        processImageColors();
                    };
                    currentImage.src = ev.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        buildParamUI();
        initSvgSegments();
    </script>
</body>
</html>
